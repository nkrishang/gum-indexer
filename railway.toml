# Railway service settings for gum-indexer (the Dockerfile is picked up automatically).
# If your project has moved to Railway's TypeScript infrastructure-as-code, mirror these values there;
# docs/runbook.md lists each one with its reason.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only. It never fails because a chain or RPC provider is down: restarting cannot fix that.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Old and new instance may overlap safely (advisory-lock leadership, idempotent writes, SKIP LOCKED outbox),
# but there is nothing to gain from a long overlap.
overlapSeconds = 0
# Railway's default of 0 means SIGKILL right after SIGTERM. We drain: finish the in-flight sweep transaction
# and webhook posts, release chain leadership so the new instance takes over at once.
drainingSeconds = 30
numReplicas = 1
