# gum-indexer base configuration (mainnet profile).
# Secrets and endpoint URLs come from the environment: GUM_<SECTION>__<KEY>, e.g.
#   GUM_CHAINS__BASE__HTTP_URL, GUM_CHAINS__BASE__WS_URL, GUM_WEBHOOK__SECRET.
# DATABASE_URL and PORT are read as-is (Railway provides both).

[server]
bind = "::"
port = 8080

[database]
max_connections = 16

[watch]
# Unpaid watches keep subscriptions and sweeps alive; expire them by default. 0 disables.
default_ttl_secs = 604800
# A caller that may register a watch late (gum-server's outbox) passes `payments_since`; blocks
# already swept since then are scanned once for the new watch. This caps how far back.
max_backfill_secs = 3600

[webhook]
connect_timeout_ms = 3000
request_timeout_ms = 10000
max_concurrency = 64
# ...of which at most this many to any one host, so a burst queues here instead of arriving at a
# consumer all at once (gum-server answers from a fixed-size database pool).
max_per_host = 8
# Exponential backoff with full jitter between base and cap; an event is marked dead after max_age.
retry_base_ms = 1000
retry_cap_ms = 3600000
max_age_secs = 86400
# Consecutive failures after which a host is parked for host_park_ms (lightweight circuit breaker).
host_failure_threshold = 5
host_park_ms = 30000
# Production: https only, no private/loopback targets...
allow_insecure_targets = false
# ...except these hosts, which may be private and reached over http. gum-server lives in the same
# Railway project and is called back over the private network. Exact host names, no wildcards.
#   GUM_WEBHOOK__HOST_ALLOWLIST='["gum-server.railway.internal"]'
host_allowlist = []

# ---------------------------------------------------------------------------------------------
# Chains. Adding a chain or a token is a config-only change.
#
# ingest_mode:
#   auto         ws_targeted while active watches <= ws_targeted_max, then large_scale_mode
#   ws_targeted  eth_subscribe(logs) filtered on recipient buckets: we are only notified of our own payments
#   ws_firehose  one token-wide subscription, recipients matched in-process (cost ~ token transfer volume)
#   poll         eth_getLogs(cursor+1..latest) every poll_interval_ms (also the fallback while WSS is down)
# credits_per_call: QuickNode chain tier, used for the local credit estimate metric.
# ---------------------------------------------------------------------------------------------

[chains.monad]
enabled = true
chain_id = 143
ingest_mode = "auto"
large_scale_mode = "poll"
confirmations = 3              # ~1s; MonadBFT finalizes in 2 blocks
expected_block_time_ms = 300
max_log_range = 100            # measured cap on QuickNode-run public RPC; raise after probing the paid endpoint
poll_interval_ms = 3000
safety_sweep_interval_ms = 30000
idle_probe_interval_ms = 60000
head_stall_threshold_ms = 15000
credits_per_call = 30

[[chains.monad.tokens]]
symbol = "USDC"
address = "0x754704Bc059F8C67012fEd69BC8A327a5aafb603"
decimals = 6
issuance = "native"

