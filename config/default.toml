# Arc (Circle): USDC is the gas token. Launched 2026-09-16. Disabled until its endpoints are configured:
#   GUM_CHAINS__ARC__ENABLED=true GUM_CHAINS__ARC__HTTP_URL=… GUM_CHAINS__ARC__WS_URL=…
[chains.arc]
enabled = false
chain_id = 5042
ingest_mode = "auto"
large_scale_mode = "poll"
# Arc finalizes deterministically: a block that exists is final, so confirmations are not reorg protection here.
# The two blocks (~1s) are margin for load-balanced providers whose eth_getLogs backend trails eth_blockNumber.
confirmations = 2
expected_block_time_ms = 500
max_log_range = 1000           # unmeasured; run gum-qn-probe limits with --token <the system emitter below>
poll_interval_ms = 2000
safety_sweep_interval_ms = 30000
idle_probe_interval_ms = 60000
head_stall_threshold_ms = 15000
credits_per_call = 20          # unverified: check the Arc tier on QuickNode's pricing page

# One asset, two interfaces: native USDC (18 decimals, msg.value) and the ERC-20 at 0x3600… (6 decimals) share one
# balance. The ERC-20 only logs ERC-20-interface transfers; the EIP-7708 system emitter logs every movement at 18
# decimals, native sends included. We index the system emitter only, so each payment counts once in 6-decimal units.
[[chains.arc.tokens]]
symbol = "USDC"
address = "0x3600000000000000000000000000000000000000"
decimals = 6
issuance = "native"
transfer_log_address = "0xfffffffffffffffffffffffffffffffffffffffe"
transfer_log_decimals = 18
