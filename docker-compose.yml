# Local Postgres for development, tests and benchmarks.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gum
      POSTGRES_PASSWORD: gum
      POSTGRES_DB: gum
    ports:
      - "54329:5432"
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gum"]
      interval: 1s
      timeout: 3s
      retries: 30
